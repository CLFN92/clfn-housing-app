<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Report a Maintenance Issue</title>
<style>
  :root{
    --accent:#f8e41a; --ink:#1b1a17; --muted:#6c6a62; --hair:#e5e3db;
    --bg:#f6f5f1; --surface:#ffffff; --danger:#b91c1c; --ok:#15803d;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-text-size-adjust:100%;padding:0 0 40px}
  .bar{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
  .bar .logo{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#111;
    display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0}
  .bar b{font-size:15px;font-weight:700}
  .bar span{font-size:11px;opacity:.7;display:block;font-weight:500}
  .wrap{max-width:520px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:6px 0 2px;font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .addr{background:var(--surface);border:1px solid var(--hair);border-left:4px solid var(--accent);
    border-radius:10px;padding:11px 14px;margin:0 0 18px;font-size:14px}
  .addr b{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin:14px 0 5px}
  .req{color:var(--danger)}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--hair);border-radius:9px;
    font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink)}
  textarea{min-height:110px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(248,228,26,.35)}
  .urg{display:flex;gap:8px}
  .urg label{flex:1;margin:0;border:1px solid var(--hair);border-radius:9px;padding:10px;text-align:center;
    cursor:pointer;background:var(--surface);font-weight:700;font-size:13px}
  .urg input{display:none}
  .urg input:checked + span{color:#111}
  .urg label:has(input:checked){background:var(--accent);border-color:var(--accent)}
  .btn{width:100%;margin-top:20px;padding:15px;border:none;border-radius:11px;background:var(--accent);
    color:#111;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
  .thumb{position:relative;width:76px;height:76px;border-radius:9px;overflow:hidden;border:1px solid var(--hair);background:var(--surface)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .rm{position:absolute;top:2px;right:2px;width:22px;height:22px;border:none;border-radius:50%;
    background:rgba(0,0,0,.62);color:#fff;font-size:15px;line-height:22px;text-align:center;cursor:pointer;padding:0}
  .addphoto{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:76px;height:76px;
    border:1.5px dashed var(--hair);border-radius:9px;color:var(--muted);font-size:12px;font-weight:700;
    cursor:pointer;text-align:center;background:var(--surface);margin:0;padding:6px}
  .addphoto.hide{display:none}
  .phint{color:var(--muted);font-size:11px;font-weight:500;margin-top:6px}
  .msg{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:13px;display:none}
  .msg.err{background:#fef2f2;border:1px solid #fecaca;color:var(--danger)}
  .center{text-align:center;padding:34px 18px}
  .check{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:var(--ok);
    display:grid;place-items:center;font-size:34px;margin:0 auto 16px}
  .ref{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);margin-top:8px;word-break:break-all}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin-top:26px}
</style>
</head>
<body>
  <div class="bar"><div class="logo" id="nlogo">H</div><div><b id="nname">Housing</b><span>Maintenance request</span></div></div>
  <div class="wrap" id="app">
    <div class="center" id="loading"><p class="sub">Checking your code&hellip;</p></div>
  </div>
  <script src="shared-config.js"></script>
  <script src="report.js"></script>
</body>
</html>
