<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>FN Hub — Platform Admin</title>
<style>
  :root{
    --accent:#f8e41a; --ink:#12131a; --muted:#6c6f7a; --hair:#e4e5ea;
    --bg:#f5f6f8; --surface:#ffffff; --danger:#b91c1c; --ok:#15803d; --line:#e4e5ea;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%;padding:0 0 48px}
  .bar{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  .bar .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:900;font-size:14px;flex-shrink:0}
  .bar b{font-size:15px;font-weight:800;letter-spacing:.3px}
  .bar span{font-size:11px;opacity:.7;display:block;font-weight:500}
  .bar .out{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .wrap{max-width:820px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:6px 0 2px;font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--hair);border-radius:9px;font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(248,228,26,.35)}
  .btn{margin-top:16px;padding:12px 16px;border:none;border-radius:10px;background:var(--accent);color:#111;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
  .btn.sm{margin-top:0;padding:7px 12px;font-size:12px;border-radius:8px}
  .btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink)}
  .btn.danger{background:#fef2f2;border:1px solid #fecaca;color:var(--danger)}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:13px;display:none}
  .msg.err{background:#fef2f2;border:1px solid #fecaca;color:var(--danger);display:block}
  .msg.ok{background:#dcfce7;border:1px solid #bbf7d0;color:var(--ok);display:block}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:16px 18px;margin-top:16px}
  .card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.4px}
  .pill.active{background:#dcfce7;color:#166534} .pill.provisioning{background:#fef9c3;color:#854d0e} .pill.suspended{background:#fee2e2;color:#991b1b}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:8px 0}
  .center{text-align:center;padding:40px 18px}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin-top:26px}
  code{background:#f0f0f4;border-radius:5px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
  <div class="bar">
    <div class="logo">FN</div>
    <div><b>FN Hub</b><span>Platform Admin</span></div>
    <button class="out" id="btn_out" style="display:none;" onclick="adminLogout()">Sign out</button>
  </div>
  <div class="wrap" id="app"><div class="center"><p class="sub">Loading…</p></div></div>
  <script src="admin-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
