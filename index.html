      </div>
    </div>

    <!-- Sign-in panel -->
    <div id="signin-panel" style="background:var(--dark2);border:1px solid var(--dark3);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px;">
      <div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:2px;">Sign in to your account</div>

      <div style="display:flex;flex-direction:column;gap:5px;">
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);">Email</label>
        <input id="signin-email" type="email" placeholder="Email address"
          style="background:var(--dark);border:1px solid var(--dark-border);border-radius:8px;padding:10px 14px;font-size:14px;color:#fff;font-family:DM Sans,sans-serif;outline:none;width:100%;box-sizing:border-box;"
          onkeydown="if(event.key==='Enter')document.getElementById('signin-password').focus()"/>
      </div>

      <div style="display:flex;flex-direction:column;gap:5px;">
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);">Password</label>
        <input id="signin-password" type="password" placeholder="Password"
          style="background:var(--dark);border:1px solid var(--dark-border);border-radius:8px;padding:10px 14px;font-size:14px;color:#fff;font-family:DM Sans,sans-serif;outline:none;width:100%;box-sizing:border-box;"
          onkeydown="if(event.key==='Enter')startSignIn()"/>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;">
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--muted);">
          <input type="checkbox" id="remember-me" style="width:14px;height:14px;cursor:pointer;accent-color:var(--yellow);">
          Remember my email
        </label>
        <button onclick="showForgotPassword()" style="background:none;border:none;font-size:12px;color:var(--yellow);cursor:pointer;padding:0;">Forgot password?</button>
      </div>

      <button id="signin-btn" onclick="this.disabled=true;this.textContent='Signing in…';startSignIn().catch(function(e){ console.error('Sign-in error:',e); })"
        style="background:var(--yellow);border:none;color:var(--dark);padding:12px;border-radius:8px;font-size:14px;font-weight:700;font-family:DM Sans,sans-serif;cursor:pointer;width:100%;">
        Sign in
      </button>
      <div id="signin-error" style="display:none;background:var(--err-bg);border:1px solid var(--err-border);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--err-text);text-align:left;"></div>
    </div>

    <!-- Email verification panel -->
    <div id="verify-panel" style="display:none;background:var(--dark2);border:1px solid var(--dark3);border-radius:14px;padding:28px;text-align:center;">
      <div style="font-size:2rem;margin-bottom:12px;">&#128231;</div>
      <div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:8px;">Check your email</div>
      <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px;">
        We sent a verification link to<br>
        <strong id="verify-email-display" style="color:#fff;"></strong><br><br>
        Click the link in that email to verify your account, then come back here and sign in again.
      </p>
      <button onclick="resendVerification()" style="background:var(--yellow);border:none;color:var(--dark);padding:10px;border-radius:8px;font-size:13px;font-weight:700;font-family:DM Sans,sans-serif;cursor:pointer;width:100%;margin-bottom:10px;">Resend verification email</button>
      <button onclick="showSignInPanel()" style="background:none;border:none;font-size:12px;color:var(--yellow);cursor:pointer;width:100%;">&#8592; Back to sign in</button>
      <div id="verify-msg" style="display:none;margin-top:10px;font-size:12px;"></div>
    </div>

    <!-- Forgot password panel -->
    <div id="forgot-panel" style="display:none;background:var(--dark2);border:1px solid var(--dark3);border-radius:14px;padding:28px;text-align:center;">
      <div style="font-size:2rem;margin-bottom:12px;">&#128273;</div>
      <div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:8px;">Reset password</div>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;">Enter your email and we'll send you a password reset link.</p>
      <input id="forgot-email" type="email" placeholder="Email address"
        style="background:var(--dark);border:1px solid var(--dark-border);border-radius:8px;padding:10px 14px;font-size:14px;color:#fff;font-family:DM Sans,sans-serif;outline:none;width:100%;box-sizing:border-box;margin-bottom:12px;"
        onkeydown="if(event.key==='Enter')sendPasswordReset()"/>
      <button onclick="sendPasswordReset()" style="background:var(--yellow);border:none;color:var(--dark);padding:10px;border-radius:8px;font-size:13px;font-weight:700;font-family:DM Sans,sans-serif;cursor:pointer;width:100%;margin-bottom:10px;">Send reset link</button>
      <button onclick="showSignInPanel()" style="background:none;border:none;font-size:12px;color:var(--yellow);cursor:pointer;width:100%;">&#8592; Back to sign in</button>
      <div id="forgot-msg" style="display:none;margin-top:10px;font-size:12px;padding:8px 12px;border-radius:6px;"></div>
    </div>

  </div>
</div>

<script>
'use strict';
// Boot — copy the brand logo into the login card, restore "remember me",
// and either redirect to the authenticated app (if a session token exists
// in sessionStorage) or show the sign-in screen.
document.addEventListener('DOMContentLoaded', function() {
  loadRememberedEmail();

  // Restored session — hand off directly to housing.html. shared-auth.js on
  // that page validates the token; if it's stale the user is bounced back here.
  var token = null;
  try { token = sessionStorage.getItem('clfn_housing_token'); } catch(e) {}
  if (token) {
    window.location.href = 'housing.html?view=home';
    return;
  }

  showLoginScreen();
});
</script>
</body>
</html>
